name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that manifest version matches the tag
        run: |
          version=$(jq -r .version custom_components/brother_ads_2700w/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json has version $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
